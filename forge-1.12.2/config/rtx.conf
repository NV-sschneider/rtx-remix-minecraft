# Prototype settings: normal Minecraft presentation and HUD remain in OpenGL.
rtx.dlfg.enable = false
rtx.vertexColorStrength = 1.0
rtx.vertexColorIsBakedLighting = false
# Modest shadow visibility increase; exposure and highlights keep the runtime defaults.
rtx.localtonemap.shadows = 2.5
rtx.enableCulling = false
rtx.gpuResidentScene = true
rtx.minimizeBlasMerging = true
rtx.opacityMicromap.enable = false
rtx.uniqueObjectDistance = 10.0
rtx.showUICursor = false
rtx.gui.enableExternalPresenter = true
rtx.remixMenuKeyBinds = CTRL, SHIFT, ALT, PAUSE
rtx.viewModel.enable = true
rtx.viewModel.perspectiveCorrection = true
